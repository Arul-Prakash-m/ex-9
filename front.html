
<!DOCTYPE html>
<html lang="en" ng-app="collegeApp">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Veridian academic information portal">

  <title>Veridian | Academic Information Portal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>

<body ng-controller="MainController as main">

  <header class="site-header">
    <div class="container nav-wrap">

      <a class="brand" href="#!/">
        <span class="brand-mark">
          <i class="fa-solid fa-graduation-cap"></i>
        </span>

        <span class="brand-copy">
          <strong>VERIDIAN</strong>
          <small>Knowledge Into Possibility.</small>
        </span>
      </a>

      <button class="menu-toggle"
              type="button"
              aria-label="Toggle navigation"
              ng-click="main.menuOpen = !main.menuOpen">
        <i class="fa-solid"
           ng-class="main.menuOpen ? 'fa-xmark' : 'fa-bars'"></i>
      </button>

      <nav class="main-nav"
           ng-class="{'is-open': main.menuOpen}"
           aria-label="Main navigation">

        <a href="#!/"
           ng-class="{'active': main.isActive('/')}"
           ng-click="main.menuOpen = false">
          Home
        </a>

        <a href="#!/about"
           ng-class="{'active': main.isActive('/about')}"
           ng-click="main.menuOpen = false">
          About
        </a>

        <a href="#!/programs"
           ng-class="{'active': main.isActive('/programs')}"
           ng-click="main.menuOpen = false">
          Programs
        </a>

        <a class="nav-cta"
           href="#!/contact"
           ng-click="main.menuOpen = false">
          Contact us <i class="fa-solid fa-arrow-right"></i>
        </a>
      </nav>
    </div>
  </header>

  <main class="route-shell">
    <div ng-view></div>
  </main>

  <footer class="site-footer">
    <div class="container footer-top">

      <a class="brand footer-brand" href="#!/">
        <span class="brand-mark">
          <i class="fa-solid fa-graduation-cap"></i>
        </span>

        <span class="brand-copy">
          <strong>VERIDIAN</strong>
          <small>Knowledge Into Possibility.</small>
        </span>
      </a>

      <p>Helping curious minds move forward with confidence.</p>

      <a class="back-top" href="#!/" aria-label="Back to top">
        <i class="fa-solid fa-arrow-up"></i>
      </a>
    </div>

    <div class="container footer-bottom">
      <span>
        © {{main.year}} Veridian Academic Portal. Student project demonstration.
      </span>

      <span>
        <i class="fa-solid fa-circle-check"></i>
        Built for learning
      </span>
    </div>
  </footer>

  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular-route.min.js"></script>
  <script src="app.js"></script>

</body>
</html>
